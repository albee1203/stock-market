# 每個交易日早上：抓台指期夜盤 → 更新盤前推薦指數與 App → 推播「前一個交易日」的觀察清單（LINE / Telegram / ntfy）。
# 需要在 Settings → Secrets and variables → Actions 設定至少一組推播憑證，見 README。
name: Morning notify

on:
  schedule:
    # GitHub 排程常延遲數十分鐘甚至被略過，所以排三次（重複執行無害：夜盤、新聞不重複，推播每天只送一次）
    # 台北時間週一至週五 07:20、08:00、08:40（UTC 前一天 23:20、當天 00:00、00:40）
    - cron: "20 23 * * 0-4"
    - cron: "0 0 * * 1-5"
    - cron: "40 0 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "已推播過也再送一次（測試用）"
        type: boolean
        default: false

permissions:
  contents: write   # 夜盤資料與資料庫存回 data 分支
  pages: write
  id-token: write

concurrency:
  group: daily-update   # 與每日更新共用，避免同時改寫資料庫
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Taipei
      DATABASE_URL: sqlite:///data/twstock.db
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # 選用；未設定則用詞典分析新聞
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-opus-5-5' }}   # 可在 Settings → Variables 改用其他模型
      APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_TO: ${{ secrets.LINE_TO }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      HOLDINGS: ${{ secrets.HOLDINGS }}   # 選用：我的持股，每行「代號,成本[,停損%,停利%]」
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 從 data 分支還原資料庫
        run: |
          mkdir -p data
          if git fetch --depth=1 origin data 2>/dev/null; then
            # 新格式為壓縮檔 twstock.db.gz；相容舊的未壓縮 twstock.db
            if git cat-file -e FETCH_HEAD:twstock.db.gz 2>/dev/null; then
              git show FETCH_HEAD:twstock.db.gz | gunzip > data/twstock.db
            else
              git show FETCH_HEAD:twstock.db > data/twstock.db
            fi
            echo "已還原資料庫：$(du -h data/twstock.db | cut -f1)"
            git show FETCH_HEAD:last_run.json > data/last_run.json 2>/dev/null || true
          else
            echo "尚無 data 分支，從空資料庫開始"
          fi

      - name: 抓台指期夜盤
        run: python -m app.cli night

      - name: 抓夜間與今晨新聞
        run: python -m app.cli news

      - name: 更新 App（加入夜盤、盤前指數與最新新聞）
        run: python -m app.cli export --out site --days 20

      - name: 推播最新清單
        continue-on-error: true   # 推播失敗仍保存資料並更新 App
        run: python -m app.cli notify ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 資料庫存回 data 分支
        run: |
          python -m app.cli compact
          tmp=$(mktemp -d)
          gzip -9 -c data/twstock.db > "$tmp/twstock.db.gz"
          size=$(stat -c %s "$tmp/twstock.db.gz")
          echo "資料庫壓縮後：$((size / 1024 / 1024)) MB"
          if [ "$size" -gt 94371840 ]; then
            echo "::error::資料庫壓縮後仍超過 90 MB，接近 GitHub 單檔 100 MB 上限，請縮短保留天數（app/maintenance.py）"
            exit 1
          fi
          cp data/last_run.json "$tmp/" 2>/dev/null || true
          cd "$tmp"
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add twstock.db.gz $(ls last_run.json 2>/dev/null)
          git commit -q -m "notify: $(date +%F_%H%M)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data


  deploy:
    needs: notify
    if: ${{ !cancelled() }}   # 資料庫存檔失敗時仍發佈 App
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
