# 每個交易日自動更新資料並發佈手機 App（GitHub Pages）。
# 第一次使用：Settings → Pages → Build and deployment → Source 選「GitHub Actions」。
name: Daily update

on:
  schedule:
    # 台北時間週一至週五 16:20（UTC 08:20）。GitHub 排程可能延遲數分鐘到數十分鐘。
    - cron: "20 8 * * 1-5"
    # 補跑：台北時間 18:20，以防第一次執行時上櫃資料尚未公布或排程被略過（重複執行無害）
    - cron: "20 10 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "指定日期 YYYY-MM-DD（留空＝今天）"
        required: false
      backfill_days:
        description: "回補幾個交易日（第一次建議 10）"
        required: false
        default: "6"

permissions:
  contents: write   # 把資料庫存到 data 分支
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Taipei
      DATABASE_URL: sqlite:///data/twstock.db
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # 選用；未設定則用詞典分析
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 從 data 分支還原資料庫
        run: |
          mkdir -p data
          if git fetch --depth=1 origin data 2>/dev/null; then
            git show FETCH_HEAD:twstock.db > data/twstock.db && echo "已還原資料庫"
          else
            echo "尚無 data 分支，從空資料庫開始"
          fi

      - name: 回補歷史資料
        run: python -m app.cli backfill --days "${{ github.event.inputs.backfill_days || '6' }}" ${{ github.event.inputs.date && format('--date {0}', github.event.inputs.date) || '' }}

      - name: 抓取並分析今日資料
        run: python -m app.cli run ${{ github.event.inputs.date && format('--date {0}', github.event.inputs.date) || '' }}

      - name: 匯出 App 網站
        run: python -m app.cli export --out site --days 20

      - name: 儲存資料庫到 data 分支
        run: |
          tmp=$(mktemp -d)
          cp data/twstock.db "$tmp/"
          cd "$tmp"
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add twstock.db
          git commit -q -m "data: $(date +%F_%H%M)"
          # data 分支只保留最新一份資料庫（單一 commit），避免 repo 膨脹
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
